services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gt_interviewer
      POSTGRES_USER: gt_interviewer
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: interviewer
      MINIO_ROOT_PASSWORD: local-development-only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "-c"]
    command: >
      until mc alias set local http://minio:9000 interviewer local-development-only; do sleep 2; done;
      mc mb --ignore-existing local/gt-interviewer

volumes:
  postgres_data:
  redis_data:
  minio_data: